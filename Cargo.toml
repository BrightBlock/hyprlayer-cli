[package]
name = "hyprlayer"

version = "1.5.8"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
git2 = { version = "0.19", features = ["vendored-openssl"] }
dirs = "5.0"
anyhow = "1.0"
colored = "2.1"
dialoguer = "0.11"
shellexpand = "3.0"
chrono-humanize = "0.1"
chrono = "0.4"
ureq = { version = "2", default-features = false, features = ["json", "tls"] }
uuid = { version = "1", features = ["v4"] }
getrandom = "0.2"
sha2 = "0.10"
hex = "0.4"
# Atomic binary replacement without pulling in a second HTTP client.
self-replace = "1.5"
tempfile = "3"
# Bounded `Child::wait_timeout` so package-manager probes can't hang CLI startup.
wait-timeout = "0.2"
# Single-request bundle download: one gzipped repo archive from codeload
# replaces ~30 rate-limited Contents API calls per install.
tar = "0.4"
flate2 = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# Safe wrapper that enables ANSI rendering in the Windows console and reports via
# Result when the console can't support it. Windows-only so it never enters the
# dependency graph for other platforms.
enable-ansi-support = "0.2"

[dev-dependencies]
