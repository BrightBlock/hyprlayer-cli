name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: hyprlayer-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: hyprlayer-aarch64-unknown-linux-gnu
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-14
            binary: hyprlayer-aarch64-apple-darwin
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            binary: hyprlayer-x86_64-pc-windows-msvc.exe

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        uses: taiki-e/install-action@cross

      - name: Build (cross)
        if: matrix.cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" == *"windows"* ]]; then
            mv target/${{ matrix.target }}/release/hyprlayer.exe ${{ matrix.binary }}
          else
            mv target/${{ matrix.target }}/release/hyprlayer ${{ matrix.binary }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.binary }}
          path: ${{ matrix.binary }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*

  update-winget:
    name: Update WinGet
    needs: release
    runs-on: windows-latest
    steps:
      - name: Publish to Windows Package Manager
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: BrightBlock.Hyprlayer
          installers-regex: '\.exe$'
          token: ${{ secrets.WINGET_TOKEN }}

  update-homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract SHA256 digests from release API
        id: checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_JSON=$(gh release view "v${VERSION}" \
            --repo BrightBlock/hyprlayer-cli \
            --json assets)
          extract() {
            local name="$1"
            echo "$RELEASE_JSON" | jq -er --arg name "$name" \
              '[.assets[] | select(.name == $name) | .digest][0]
               | select(type == "string" and test("^sha256:[A-Fa-f0-9]{64}$"))
               | sub("^sha256:"; "")'
          }
          if ! macos_arm64=$(extract hyprlayer-aarch64-apple-darwin) ||
             ! linux_x86_64=$(extract hyprlayer-x86_64-unknown-linux-gnu) ||
             ! linux_arm64=$(extract hyprlayer-aarch64-unknown-linux-gnu); then
            echo "ERROR: missing or malformed sha256 digest entries in release API response" >&2
            echo "$RELEASE_JSON" >&2
            exit 1
          fi
          {
            echo "macos_arm64=$macos_arm64"
            echo "linux_x86_64=$linux_x86_64"
            echo "linux_arm64=$linux_arm64"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout tap repo
        uses: actions/checkout@v6
        with:
          repository: BrightBlock/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_MACOS_ARM64: ${{ steps.checksums.outputs.macos_arm64 }}
          SHA_LINUX_X86_64: ${{ steps.checksums.outputs.linux_x86_64 }}
          SHA_LINUX_ARM64: ${{ steps.checksums.outputs.linux_arm64 }}
        run: |
          VERSION="${VERSION#v}"
          FORMULA="homebrew-tap/Formula/hyprlayer.rb"
          sed -i "s/version \".*\"/version \"${VERSION}\"/" "$FORMULA"
          sed -i "s/sha256 \"PLACEHOLDER_MACOS_ARM64\"/sha256 \"${SHA_MACOS_ARM64}\"/" "$FORMULA"
          sed -i "s/sha256 \"PLACEHOLDER_LINUX_X86_64\"/sha256 \"${SHA_LINUX_X86_64}\"/" "$FORMULA"
          sed -i "s/sha256 \"PLACEHOLDER_LINUX_ARM64\"/sha256 \"${SHA_LINUX_ARM64}\"/" "$FORMULA"
          cd homebrew-tap
          sed -i -E "/aarch64-apple-darwin/,/sha256/{s/sha256 \"[a-f0-9]{64}\"/sha256 \"${SHA_MACOS_ARM64}\"/}" Formula/hyprlayer.rb
          sed -i -E "/x86_64-unknown-linux-gnu/,/sha256/{s/sha256 \"[a-f0-9]{64}\"/sha256 \"${SHA_LINUX_X86_64}\"/}" Formula/hyprlayer.rb
          sed -i -E "/aarch64-unknown-linux-gnu/,/sha256/{s/sha256 \"[a-f0-9]{64}\"/sha256 \"${SHA_LINUX_ARM64}\"/}" Formula/hyprlayer.rb
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Formula/hyprlayer.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          git add Formula/hyprlayer.rb
          git diff --cached --quiet && exit 0
          git commit -m "Update hyprlayer to ${VERSION}"
          git push

  update-scoop:
    name: Update Scoop
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Extract SHA256 digest from release API
        id: hash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! sha256=$(gh release view "v${VERSION}" \
              --repo BrightBlock/hyprlayer-cli \
              --json assets \
              | jq -er '[.assets[] | select(.name == "hyprlayer-x86_64-pc-windows-msvc.exe") | .digest][0]
                         | select(type == "string" and test("^sha256:[A-Fa-f0-9]{64}$"))
                         | sub("^sha256:"; "")'); then
            echo "ERROR: missing or malformed Windows sha256 digest in release API response" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Checkout scoop bucket
        uses: actions/checkout@v6
        with:
          repository: BrightBlock/scoop-bucket
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: scoop-bucket

      - name: Update manifest
        env:
          VERSION: ${{ github.ref_name }}
          SHA256: ${{ steps.hash.outputs.sha256 }}
        run: |
          VERSION="${VERSION#v}"
          MANIFEST="scoop-bucket/bucket/hyprlayer.json"
          sed -i "s/\"version\": \".*\"/\"version\": \"${VERSION}\"/" "$MANIFEST"
          sed -i "s/\"hash\": \".*\"/\"hash\": \"${SHA256}\"/" "$MANIFEST"
          sed -i "s|/download/v[^/]*/|/download/v${VERSION}/|" "$MANIFEST"

      - name: Commit and push
        run: |
          cd scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="${GITHUB_REF_NAME#v}"
          git add bucket/hyprlayer.json
          git diff --cached --quiet && exit 0
          git commit -m "Update hyprlayer to ${VERSION}"
          git push

  update-aur:
    name: Update AUR
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Update PKGBUILD with version and SHA256 digests from release API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          RELEASE_JSON=$(gh release view "v${VERSION}" \
            --repo BrightBlock/hyprlayer-cli \
            --json assets)
          extract() {
            local name="$1"
            echo "$RELEASE_JSON" | jq -er --arg name "$name" \
              '[.assets[] | select(.name == $name) | .digest][0]
               | select(type == "string" and test("^sha256:[A-Fa-f0-9]{64}$"))
               | sub("^sha256:"; "")'
          }
          if ! SHA_X86_64=$(extract hyprlayer-x86_64-unknown-linux-gnu) ||
             ! SHA_AARCH64=$(extract hyprlayer-aarch64-unknown-linux-gnu); then
            echo "ERROR: missing or malformed Linux sha256 digest entries in release API response" >&2
            echo "$RELEASE_JSON" >&2
            exit 1
          fi
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD-bin
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${SHA_X86_64}')/" PKGBUILD-bin
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${SHA_AARCH64}')/" PKGBUILD-bin
          cp PKGBUILD-bin PKGBUILD
          echo "--- patched PKGBUILD ---"
          cat PKGBUILD

      - name: Publish hyprlayer-bin to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: hyprlayer-bin
          pkgbuild: ./PKGBUILD
          commit_username: jtsiros
          commit_email: jon@brightblock.ai
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ github.ref_name }}"
          ssh_keyscan_types: ed25519,rsa
